name: Build Android APK & Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using the permanent signing key from repo secrets"
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release-keystore.p12"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release-keystore.p12" >> "$GITHUB_ENV"
          else
            echo "::error::KEYSTORE_BASE64 / KEYSTORE_PASSWORD secrets are not set. A deploy signed with a throwaway key would be offered to every installed app as an update it cannot install. Run tools/setup-signing.sh once."
            exit 1
          fi

      - name: Build Android Release APK
        run: |
          cd android
          gradle assembleRelease --no-daemon --stacktrace

      - name: Stage the site (only what the website needs)
        run: |
          mkdir -p site
          cp index.html sw.js manifest.json icon.svg icon-192.png icon-512.png apple-touch-icon.png pogo_qr_code.png version.json site/
          cp android/app/build/outputs/apk/release/app-release.apk site/pogo-companion.apk
          cp site/pogo-companion.apk ./pogo-companion.apk
          ls -lh site

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pogo-companion-apk
          path: ./pogo-companion.apk

      - name: Make sure no secrets are in the published tree
        run: |
          ! find site -name "*.p12" -o -name "*.jks" -o -name "*.kt" | grep .

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

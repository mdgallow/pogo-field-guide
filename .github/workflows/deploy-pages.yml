name: Build Android APK & Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Official Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/release-keystore.jks \
            -alias pogo-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass pogo2026pass \
            -keypass pogo2026pass \
            -dname "CN=PoGo Companion, OU=Mobile, O=PoGo Field Guide, L=San Jose, ST=CA, C=US"

      - name: Build Android Release APK
        run: |
          cd android
          gradle assembleRelease --no-daemon --stacktrace

      - name: Stage APK for Pages & Direct Download
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ./pogo-companion.apk
          echo "Official Signed Release APK successfully built and staged:"
          ls -lh ./pogo-companion.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pogo-companion-apk
          path: ./pogo-companion.apk

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

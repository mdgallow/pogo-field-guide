name: Watch upstream Pokémon GO data

# Twice-weekly check. Two reports, two issues: "Prepare" (announced events: get the work ready on
# the branch, no release) and "Release" (data that actually moved in the game: bundle and ship once).
# Every source is a public GitHub-hosted mirror; nothing touches the game or its makers' servers,
# and nothing is committed by the workflow.
on:
  schedule:
    - cron: "17 6 * * 1,4"   # Mondays and Thursdays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare live sources with the recorded baseline
        id: watch
        run: |
          set +e
          python3 tools/watch_upstream.py > report.txt
          code=$?
          set -e
          cat report.txt
          echo "changed=$([ "$code" = "3" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          if [ "$code" != "0" ] && [ "$code" != "3" ]; then exit "$code"; fi

      - name: Open or update the issues
        if: steps.watch.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          post() {   # title, section text, label
            [ -z "$2" ] && return 0
            body="$(printf 'Detected on %s by the upstream watcher (see docs/UPSTREAM-WATCH.md for the maintenance steps).\n\n```\n%s\n```\n' "$(date -u +%F)" "$2")"
            existing=$(gh issue list --state open --search "\"$1\" in:title" --json number -q '.[0].number')
            if [ -n "$existing" ]; then gh issue comment "$existing" --body "$body"
            else gh issue create --title "$1" --body "$body" --label "$3" 2>/dev/null || gh issue create --title "$1" --body "$body"; fi
          }
          upcoming="$(awk '/^UPCOMING/{f=1} /^CONFIRMED CHANGES/{f=0} f' report.txt)"
          confirmed="$(awk '/^CONFIRMED CHANGES/{f=1} f' report.txt)"
          post "Prepare: upcoming Pokémon GO changes (no release yet)" "$upcoming" "upstream-upcoming"
          post "Release: Pokémon GO data changed (bundle and ship)" "$confirmed" "upstream"

name: Build test APK (no deploy)

# Branch builds for on-device testing. Unlike deploy-pages.yml this never touches the live
# GitHub Pages site; it only produces a downloadable APK artifact.
on:
  push:
    branches-ignore: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using the permanent signing key from repo secrets"
            echo "$KEYSTORE_BASE64" | base64 -d > android/release-keystore.p12
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets set (run tools/setup-signing.sh once). Using a throwaway key: this APK cannot be installed over any other build."
            THROWAWAY=$(openssl rand -hex 16)
            keytool -genkeypair -keystore android/release-keystore.p12 -storetype PKCS12               -alias pogo-release -keyalg RSA -keysize 2048 -validity 10000               -storepass "$THROWAWAY" -keypass "$THROWAWAY"               -dname "CN=PoGo Companion, OU=Mobile, O=PoGo Field Guide, C=US"
            echo "KEYSTORE_PASSWORD=$THROWAWAY" >> "$GITHUB_ENV"
          fi

      - name: Build Android Release APK
        run: |
          cd android
          gradle assembleRelease --no-daemon --stacktrace

      - name: Verify the WebView page was bundled
        run: unzip -l android/app/build/outputs/apk/release/app-release.apk | grep "assets/index.html"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pogo-companion-apk
          path: android/app/build/outputs/apk/release/app-release.apk
